<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nafi's Library</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            /* CYBER BLACK & YELLOW PALETTE */
            --bg-dark: #000000;      /* Pure Void */
            --bg-panel: #111111;     /* Matte Dark */
            --accent: #FFD700;       /* Cyber Yellow */
            --accent-dim: #C5A600;   /* Darker Gold */
            --text-main: #ffffff;    /* Pure White */
            --text-muted: #666666;   /* Dark Gray */
            --border: #333333;       /* Subtle Borders */
            --header-h: 64px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif; margin: 0; padding: 0; height: 100vh;
            background: var(--bg-dark); color: var(--text-main); overflow: hidden;
        }

        .hidden { opacity: 0; pointer-events: none; z-index: -1; }
        .view-section {
            width: 100vw; height: 100vh; position: absolute; top: 0; left: 0;
            background: var(--bg-dark); transition: opacity 0.3s; overflow: hidden; 
        }

        /* HEADER */
        #header {
            position: absolute; top: 0; left: 0; width: 100%; height: var(--header-h);
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; z-index: 100;
        }

        .h-left, .h-right { flex: 1; display: flex; align-items: center; gap: 20px; min-width: 0;}
        .h-right { justify-content: flex-end; }
        .h-center {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; align-items: center;
        }

        .back-btn { background: none; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .back-btn:hover { color: var(--accent); }

        /* LIBRARY */
        #library-view { z-index: 50; padding: 40px; overflow-y: auto; }
        .lib-title { font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 5px; text-transform: uppercase; letter-spacing: -1px; }
        .bookshelf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; max-width: 1200px; margin: 40px auto; padding-bottom: 100px; }
        
        .book-card {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px;
            padding: 24px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center;
        }
        .book-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); }
        .book-icon { font-size: 2.5rem; color: var(--text-muted); margin-bottom: 15px; }
        .book-title { font-weight: 600; text-align: center; margin-bottom: 15px; line-height: 1.4; }
        
        .progress-track { width: 100%; height: 2px; background: #333; margin-top: auto; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; box-shadow: 0 0 10px var(--accent); }
        .progress-text { font-family: 'JetBrains Mono'; font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }

        /* TIMER (FIXED WIDTH) */
        .timer-box {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px;
            padding: 4px 12px; display: flex; align-items: center; gap: 10px;
        }
        .timer-input { 
            background: transparent; border: none; color: var(--accent); 
            width: 45px; text-align: center; font-family: 'JetBrains Mono'; font-weight: 700; outline: none;
        }
        .timer-btn { color: var(--text-muted); background: none; border: none; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .timer-btn:hover { color: var(--accent); }
        .timer-display { font-family: 'JetBrains Mono'; color: var(--accent); font-weight: 700; width: 50px; text-align: center; }

        /* READER */
        #main-container { position: absolute; top: var(--header-h); left: 0; right: 0; bottom: 0; display: flex; }
        #pdf-viewport { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; background: #050505; }
        #pdf-scroll-area { flex: 1; overflow-y: auto; padding: 40px 0; display: flex; flex-direction: column; align-items: center; }
        
        /* PAGE WRAPPER & TEXT LAYER FIX */
        .page-wrapper { margin-bottom: 20px; position: relative; flex-shrink: 0; box-shadow: 0 0 30px rgba(0,0,0,0.8); border: 1px solid #222; }
        .textLayer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; opacity: 1; line-height: 1.0; }
        .textLayer > span { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
        
        /* High Contrast Selection Color (Yellow Glow) */
        .textLayer ::selection { background: rgba(255, 215, 0, 0.4); color: transparent; }

        /* SIDEBAR (UPDATED) */
        #sidebar { 
            width: 400px; /* Wider */
            background: var(--bg-panel); 
            border-left: 1px solid var(--border); 
            display: flex; flex-direction: column; z-index: 90; 
        }
        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.7rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
        
        /* Translation Cards (UPDATED) */
        .term-card { background: var(--bg-dark); border: 1px solid var(--border); border-left: 2px solid var(--accent); border-radius: 0 4px 4px 0; padding: 16px; margin: 12px; animation: slideIn 0.2s; }
        .term-original { font-weight: 700; color: var(--text-main); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; font-size: 1.1rem; }
        
        .trans-row { margin-bottom: 8px; font-family: 'JetBrains Mono'; font-size: 1rem; } /* Bigger */
        .trans-label { color: #aaaaaa; font-size: 0.8rem; display: inline-block; width: 85px; } /* Lighter & Bigger */
        .trans-val { color: var(--accent); font-size: 1.1rem; } /* Bigger */
        
        .dict-entry { 
            margin-top: 10px; 
            font-size: 1rem; /* Bigger */
            color: #e5e5e5; /* Much lighter/readable */
            border-top: 1px dashed var(--border); 
            padding-top: 8px; 
            line-height: 1.5; /* Better spacing */
        }

        @keyframes slideIn { from{transform:translateX(10px);opacity:0} to{transform:translateX(0);opacity:1} }

        .page-controls { display: flex; align-items: center; gap: 10px; background: var(--bg-panel); padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border); }
        .page-input { background: transparent; border: none; color: var(--text-main); width: 40px; text-align: center; font-family: 'JetBrains Mono'; outline: none; }

        /* LOGIN */
        #login-view { z-index: 200; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--bg-panel); padding: 40px; border-radius: 4px; border: 1px solid var(--border); text-align: center; width: 350px; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        
        .login-input { 
            width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border); 
            color: var(--accent); font-family: 'JetBrains Mono'; text-align: center; margin: 20px 0; 
            border-radius: 4px; outline: none; transition: 0.2s; 
        }
        .login-input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        
        .login-btn { 
            background: var(--accent); color: var(--bg-dark); border: none; padding: 12px; width: 100%; 
            font-weight: 800; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; 
            transition: 0.2s;
        }
        .login-btn:hover { background: #fff; box-shadow: 0 0 15px var(--accent); }

        .loader { position: absolute; inset: 0; background: var(--bg-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 150; }
        .spinner { color: var(--accent); font-size: 2rem; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="login-view" class="view-section">
        <div class="login-card">
            <i class="fas fa-terminal" style="font-size:3rem; color:var(--accent); margin-bottom:20px;"></i>
            <h2 style="margin-bottom:10px; font-weight:800; letter-spacing:-0.5px;">SYSTEM ACCESS</h2>
            <input type="password" id="pass-input" class="login-input" placeholder="ACCESS KEY">
            <button class="login-btn" onclick="login()">Initialize</button>
            <div id="login-msg" style="color:var(--accent); margin-top:10px; font-size:0.7rem; font-family:'JetBrains Mono'; height:1rem;"></div>
        </div>
    </div>

    <div id="library-view" class="view-section hidden">
        <div style="padding: 40px 40px 0 40px;">
            <div class="lib-title">Workspace</div>
            <div style="color:var(--text-muted); font-family:'JetBrains Mono'; font-size:0.9rem;">// READING_LIST_LOADED</div>
        </div>
        <div id="bookshelf" class="bookshelf-grid">
            <div style="text-align:center; color:var(--text-muted); grid-column:1/-1;">Fetching Data...</div>
        </div>
    </div>

    <div id="reader-view" class="view-section hidden">
        <div id="header">
            <div class="h-left">
                <button class="back-btn" onclick="closeBook()"><i class="fas fa-arrow-left"></i> RETURN</button>
                <div id="book-title" style="font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase;">Title</div>
            </div>
            
            <div class="h-center">
                <div id="timer-idle" class="timer-box">
                    <span style="font-size:0.7rem; color:var(--text-muted); font-weight:700; letter-spacing:1px;">SESSION</span>
                    <input type="number" id="t-input" class="timer-input" value="30">
                    <span style="font-size:0.7rem; color:var(--text-muted); font-weight:700; letter-spacing:1px;">MIN</span>
                    <button class="timer-btn" onclick="startTimer()"><i class="fas fa-play"></i></button>
                </div>
                <div id="timer-active" class="timer-box" style="display:none;">
                    <span id="t-display" class="timer-display">30:00</span>
                    <button class="timer-btn" onclick="stopTimer()"><i class="fas fa-stop"></i></button>
                </div>
            </div>

            <div class="h-right">
                <div id="last-read-badge" style="font-size:0.8rem; color:var(--accent); font-family:'JetBrains Mono'; display:none; border:1px solid var(--border); padding:4px 8px; border-radius:4px;">
                    LAST: <span id="last-read-val">0</span>
                </div>
                <div class="page-controls">
                    <button class="timer-btn" onclick="nav(-1)"><i class="fas fa-chevron-left"></i></button>
                    <input type="number" id="p-input" class="page-input" value="0">
                    <span style="color:var(--text-muted)">/</span>
                    <span id="p-total" style="color:var(--text-muted)">0</span>
                    <button class="timer-btn" onclick="nav(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>

        <div id="main-container">
            <div id="pdf-viewport">
                <div id="pdf-scroll-area"></div>
                <div id="loader" class="loader hidden">
                    <i class="fas fa-square fa-spin spinner"></i>
                    <div style="font-family:'JetBrains Mono'; color:var(--accent); letter-spacing:2px; font-size:0.8rem;">DOWNLOADING STREAM...</div>
                </div>
            </div>
            <div id="sidebar">
                <div class="sidebar-header"><i class="fas fa-code"></i> Translation Console</div>
                <div id="data-display" style="flex:1; overflow-y:auto; padding:10px;">
                    <div style="text-align:center; color:var(--border); margin-top:50px; font-family:'JetBrains Mono'; font-size:0.8rem;">// AWAITING_SELECTION</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const API_URL = "https://script.google.com/macros/s/AKfycbyWzMesQ-cASULz1uOoPRQS1lu8dqyYSRJl7vAdcFCusYAn_VCQuFx4QCQWfBlbNzq2sw/exec"; 

        // --- STATE ---
        let lib = [], curId = null, pdf = null, pages = 0, userTyping = false;
        let tInterval = null, tTime = 0;

        // --- AUTH ---
        async function login() {
            const pass = document.getElementById('pass-input').value;
            const msg = document.getElementById('login-msg');
            msg.textContent = "AUTHENTICATING...";
            
            try {
                const res = await fetch(`${API_URL}?op=login&pass=${encodeURIComponent(pass)}`);
                if ((await res.text()) === "CORRECT") {
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('library-view').classList.remove('hidden');
                    loadLib();
                } else throw new Error();
            } catch { msg.textContent = "ACCESS DENIED"; }
        }
        document.getElementById('pass-input').addEventListener('keypress', e => { if(e.key==='Enter') login() });

        // --- LIBRARY ---
        async function loadLib() {
            const grid = document.getElementById('bookshelf');
            try {
                lib = await (await fetch(API_URL + "?op=library")).json();
                grid.innerHTML = '';
                if(lib.length===0) grid.innerHTML = '<div style="color:#555">No Data Found</div>';
                
                lib.forEach(b => {
                    const d = document.createElement('div');
                    d.className = 'book-card';
                    d.onclick = () => loadBook(b.id);
                    d.innerHTML = `
                        <i class="fas fa-book book-icon"></i>
                        <div class="book-title">${b.title}</div>
                        <div class="progress-track"><div class="progress-fill" style="width:${b.progress}%"></div></div>
                        <div class="progress-text">${b.progress}% COMPLETED</div>
                    `;
                    grid.appendChild(d);
                });
            } catch { grid.innerHTML = "CONNECTION ERROR"; }
        }

        // --- READER ---
        async function loadBook(id) {
            const b = lib.find(x => x.id === id);
            curId = id;
            document.getElementById('book-title').textContent = b.title;
            
            document.getElementById('library-view').classList.add('hidden');
            document.getElementById('reader-view').classList.remove('hidden');
            document.getElementById('loader').classList.remove('hidden');

            try {
                const b64 = await (await fetch(`${API_URL}?op=read&id=${id}`)).text();
                if(b64.startsWith("ERROR")) throw new Error();
                
                const bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
                for (let i=0; i<len; i++) bytes[i] = bin.charCodeAt(i);

                pdf = await pdfjsLib.getDocument({data: bytes}).promise;
                pages = pdf.numPages;
                document.getElementById('p-total').textContent = pages;

                const area = document.getElementById('pdf-scroll-area');
                area.innerHTML = '';
                const page1 = await pdf.getPage(1);
                const vp = page1.getViewport({scale:1});
                const scale = (area.clientWidth - 40) / vp.width;

                for(let i=1; i<=pages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({scale});
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'page-wrapper'; 
                    wrapper.id = `pg-${i}`; 
                    wrapper.dataset.n = i;
                    wrapper.style.width = viewport.width+'px'; 
                    wrapper.style.height = viewport.height+'px';
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width; 
                    canvas.height = viewport.height;
                    const ctx = canvas.getContext('2d');
                    
                    const textLayer = document.createElement('div');
                    textLayer.className = 'textLayer';
                    textLayer.style.width = viewport.width+'px'; 
                    textLayer.style.height = viewport.height+'px';
                    
                    wrapper.append(canvas, textLayer); 
                    area.append(wrapper);

                    await page.render({canvasContext: ctx, viewport: viewport}).promise;
                    const textContent = await page.getTextContent();
                    pdfjsLib.renderTextLayer({ textContent: textContent, container: textLayer, viewport: viewport, textDivs: [] });
                }

                if(b.currentPage > 1) {
                    document.getElementById('last-read-badge').style.display = 'block';
                    document.getElementById('last-read-val').textContent = b.currentPage;
                } else {
                    document.getElementById('last-read-badge').style.display = 'none';
                }

                document.getElementById('p-input').value = 1;
                area.scrollTop = 0;
                document.getElementById('loader').classList.add('hidden');

            } catch { alert("DATA CORRUPTION DETECTED"); document.getElementById('loader').classList.add('hidden'); }
        }

        function closeBook() {
            document.getElementById('reader-view').classList.add('hidden');
            document.getElementById('library-view').classList.remove('hidden');
            stopTimer(); loadLib(); // Refetch library
        }

        // --- TIMER ---
        function startTimer() {
            tTime = parseInt(document.getElementById('t-input').value) * 60;
            if(!tTime) return;
            document.getElementById('timer-idle').style.display = 'none';
            document.getElementById('timer-active').style.display = 'flex';
            updTimer();
            tInterval = setInterval(() => {
                tTime--; updTimer();
                if(tTime<=0) { stopTimer(); alert("SESSION COMPLETE"); }
            }, 1000);
        }
        function stopTimer() {
            clearInterval(tInterval);
            document.getElementById('timer-idle').style.display = 'flex';
            document.getElementById('timer-active').style.display = 'none';
        }
        function updTimer() {
            const m = Math.floor(tTime/60), s = tTime%60;
            document.getElementById('t-display').textContent = `${m}:${s<10?'0':''}${s}`;
        }

        // --- NAV ---
        const pIn = document.getElementById('p-input');
        const area = document.getElementById('pdf-scroll-area');
        let scT;

        pIn.addEventListener('focus', () => { userTyping=true; window.scrollTo(0,0); });
        pIn.addEventListener('blur', () => userTyping=false);
        pIn.addEventListener('keypress', e => { if(e.key==='Enter') jump(parseInt(pIn.value)) });

        function nav(d) { jump((parseInt(pIn.value)||1) + d); }
        function jump(n) {
            if(n<1 || n>pages) return;
            document.getElementById(`pg-${n}`).scrollIntoView({block:'start'});
            pIn.value = n; pIn.blur(); save(n);
        }

        area.addEventListener('scroll', () => {
            if(userTyping) return;
            clearTimeout(scT);
            scT = setTimeout(() => {
                let best = 1, dist = Infinity;
                document.querySelectorAll('.page-wrapper').forEach(p => {
                    const d = Math.abs(p.getBoundingClientRect().top - 64);
                    if(d < dist) { dist = d; best = parseInt(p.dataset.n); }
                });
                if(best !== parseInt(pIn.value)) { 
                    pIn.value = best; 
                    save(best); // Save progress
                }
            }, 100);
        });

        async function save(p) { 
            const book = lib.find(b => b.id === curId);
            if(book) book.currentPage = p;
            if(curId) fetch(`${API_URL}?op=update&id=${curId}&page=${p}&total=${pages}`, {mode:'no-cors'}); 
        }

        // --- INTELLIGENCE SUITE ---
        document.addEventListener('mouseup', () => {
            const t = window.getSelection().toString().trim();
            if(t) trans(t);
        });

        async function trans(txt) {
            const box = document.getElementById('data-display');
            box.innerHTML = '<div style="color:var(--accent); text-align:center; font-family:\'JetBrains Mono\'">PROCESSING...</div>';
            
            try {
                const isWord = !txt.includes(' ') && txt.length < 25;
                const [gRes, mRes, dRes] = await Promise.all([
                    fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=bn&dt=t&q=${encodeURIComponent(txt)}`).catch(e=>null),
                    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(txt)}&langpair=en|bn`).catch(e=>null),
                    isWord ? fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${txt}`).catch(e=>null) : null
                ]);

                let gText = "---";
                if(gRes && gRes.ok) {
                    const j = await gRes.json();
                    gText = j[0].map(x=>x[0]).join('');
                }

                let mText = "---";
                if(mRes && mRes.ok) {
                    const j = await mRes.json();
                    mText = j.responseData.translatedText;
                }

                const hasBengali = (s) => /[\u0980-\u09FF]/.test(s);
                const bestTrans = hasBengali(gText) ? gText : (hasBengali(mText) ? mText : gText);
                const source = bestTrans === gText ? "GOOG" : "MYMEM";

                let html = `
                    <div class="term-card">
                        <div class="term-original">${txt}</div>
                        <div class="trans-row"><span class="trans-label">BN [${source}]:</span> <span class="trans-val">${bestTrans}</span></div>
                    </div>`;

                if(dRes && dRes.ok) {
                    const dData = await dRes.json();
                    if(Array.isArray(dData)) {
                        dData[0].meanings.forEach(m => {
                            html += `<div class="term-card"><div class="term-original" style="color:#aaaaaa">${m.partOfSpeech.toUpperCase()}</div>`;
                            m.definitions.slice(0, 2).forEach(d => {
                                html += `<div class="dict-entry"># ${d.definition}</div>`;
                            });
                            html += `</div>`;
                        });
                    }
                }

                box.innerHTML = html;

            } catch(e) { 
                console.error(e);
                box.innerHTML = '<div style="color:#ef4444; text-align:center; font-family:\'JetBrains Mono\'">DATA STREAM FAILED</div>'; 
            }
        }
    </script>
</body>
</html>
